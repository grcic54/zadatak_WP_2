<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video igre</title>

    <link rel="stylesheet" href="dist/output.css">
    <script type="module" src="js/main.js"></script>
</head>
<body class="bg-slate-800 text-slate-200">
    <main class="mx-auto max-w-5xl p-4">
        <header class="mb-4">
            <h1 class="p-4 border-2 bg-slate-600 rounded w-full text-2xl font-bold flex justify-center">Video igre</h1>
            <p id="count" class="text-slate-300 flex justify-center p-2 m-2 font-bold"></p>
        </header>
        <p id="loading">Učitavanje igara</p>
        <div id="list" class="grid gap-4 sm:grid-cols-2 md:grid-cols-3"></div>
        <p id="empty" class="hidden rounded-lg bg-white p-4 text-center">Danas nema igara za prikaz</p>

    </main>
</body>
</html>
